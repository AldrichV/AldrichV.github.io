<figure class="model3d" id="stair3d">
  <div class="model3d-stage">
    <canvas aria-label="Interactive 3D model of the steel stair with composite treads"></canvas>
    <button type="button" class="model3d-start">tap to load the 3D model</button>
    <p class="model3d-err" hidden>The 3D model couldn't load here, but the drawings below show the same stair.</p>
    <div class="model3d-views" role="group" aria-label="Camera views">
      <button type="button" data-view="iso">iso</button><button type="button" data-view="side">side</button><button type="button" data-view="front">front</button><button type="button" data-view="under">under</button>
    </div>
  </div>
  <div class="model3d-controls">
    <label class="model3d-lift">lift the boards <input type="range" min="0" max="14" step="0.5" value="0" data-k="lift"><output>0"</output></label>
    <label><input type="checkbox" checked data-k="treads"> tread boards</label>
    <label><input type="checkbox" checked data-k="risers"> riser boards</label>
    <label><input type="checkbox" checked data-k="glass"> glass</label>
    <label><input type="checkbox" checked data-k="near"> near-side guard</label>
  </div>
  <figcaption>drag to spin · click, then scroll or pinch to zoom · right-drag to pan</figcaption>
</figure>

{% include model-scripts.html viewer='stair' %}
