# Site settings — edit these first
title: Aldrich Valloyas
description: Engineering work, passion projects and a journal by Aldrich Valloyas.
intro: >-
  I'm a mechanical engineering graduate, now working in engineering and
  building passion projects on the side. I like taking an idea from a hand
  sketch to CAD to something that floats, drives or spins — then finding out,
  on the bench or in the bathtub, whether it actually works.

# Contact links shown in the footer. Leave a value empty to hide it.
email: "aldrichkylevalloyas@gmail.com"
instagram: "aldrich.kv"   # handle, no @
linkedin: ""         # full URL
github: ""           # full URL
goatcounter: ""      # your GoatCounter code (the part before .goatcounter.com) for private visit counts
resume: "/resume/"   # the printable résumé page (or a PDF path)

# If the repo is named <username>.github.io, leave baseurl empty.
# If it's any other name (e.g. "portfolio"), set baseurl: "/portfolio".
url: "https://aldrichv.github.io"
baseurl: ""

collections:
  projects:
    output: true
    permalink: /projects/:name/
  journal:
    output: true
    permalink: /journal/:year/:month/:title/

# Filter labels for the project index (key: label)
themes:
  drivetrains: Drivetrains & machines
  mechatronics: Mechatronics & control
  energy: Energy & thermal
  sustainability: Sustainability
  building: Building code design

defaults:
  - scope: { path: "", type: projects }
    values: { layout: project }
  - scope: { path: "", type: posts }
    values: { layout: post }
  - scope: { path: "", type: journal }
    values: { layout: journal-entry }

permalink: /blog/:year/:title/
markdown: kramdown
kramdown:
  input: GFM
plugins:
  - jekyll-seo-tag
exclude: [README.md, Gemfile, Gemfile.lock, preview]
