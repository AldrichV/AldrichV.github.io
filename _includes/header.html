<header class="site-header wrap">
  <a class="home" href="{{ '/' | relative_url }}">{{ site.title }}</a>
  <nav aria-label="Main">
    <a href="{{ '/' | relative_url }}" {% if page.url == '/' %}aria-current="page"{% endif %}>About</a>
    <a href="{{ '/projects/' | relative_url }}" {% if page.url contains '/projects/' %}aria-current="page"{% endif %}>Projects</a>
    <a href="{{ '/journal/' | relative_url }}" {% if page.url contains '/journal/' %}aria-current="page"{% endif %}>Journal</a>
    {% if site.posts.size > 0 %}<a href="{{ '/blog/' | relative_url }}" {% if page.url contains '/blog/' %}aria-current="page"{% endif %}>Notes</a>{% endif %}
    {% if site.resume != "" %}<a href="{{ site.resume | relative_url }}">Résumé</a>{% endif %}
    <button type="button" class="night-toggle" aria-pressed="false" hidden>
      <svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a7 7 0 1 0 10.5 10.5z"/></svg>
      <svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6"/></svg>
      <span>night mode</span>
    </button>
  </nav>
</header>
