<figure class="model3d" id="kart3d">
  <div class="model3d-stage">
    <canvas aria-label="Interactive 3D model of the hospital delivery go-kart, built from the dimensioned layout"></canvas>
    <button type="button" class="model3d-start">tap to load the 3D model</button>
    <p class="model3d-err" hidden>The 3D model couldn't load here, but the drawings below show the same kart.</p>
    <div class="model3d-views" role="group" aria-label="Camera views">
      <button type="button" data-view="iso">iso</button><button type="button" data-view="side">side</button><button type="button" data-view="front">front</button><button type="button" data-view="top">top</button>
    </div>
  </div>
  <div class="model3d-controls">
    <span class="model3d-steer" role="group" aria-label="Steering">steer
      <button type="button" data-steer="90">left (90°)</button><button type="button" data-steer="53" aria-pressed="true">straight (53°)</button><button type="button" data-steer="135">right (135°)</button>
    </span>
    <label><input type="checkbox" data-k="spin"> drive</label>
    <label><input type="checkbox" data-k="xray"> see the gearbox</label>
    <label><input type="checkbox" checked data-k="bed"> bed</label>
  </div>
  <figcaption>built from the dimensioned layout · drag to spin · click, then scroll or pinch to zoom · right-drag to pan</figcaption>
</figure>

{% include model-scripts.html viewer='kart' %}
