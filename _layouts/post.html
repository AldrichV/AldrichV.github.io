---
layout: default
---
<article>
  <div class="wrap article-head">
    <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time>
    <h1>{{ page.title }}</h1>
    {% if page.summary %}<p class="lede measure">{{ page.summary }}</p>{% endif %}
  </div>
  <div class="wrap prose">
    {{ content }}
    <a class="back" href="{{ '/blog/' | relative_url }}">All writing</a>
  </div>
</article>
